plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.mostlynick3.wowchat'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mostlynick3.wowchat'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
        // Chaquopy ABIs (x86 dropped upstream; these three remain).
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

// CPython on Android. The entire chat backend (app/ + wow/) runs
// unmodified; pip deps mirror requirements.txt.
chaquopy {
    defaultConfig {
        version '3.11'
        pip {
            install 'Flask>=3.0,<4.0'
        }
    }
}

dependencies {
}
