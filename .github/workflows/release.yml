name: build-and-release

# Every push to main: build the server + desktop binaries on all OSes
# and (re)publish them on the rolling "continuous" release.
# Nothing binary is ever stored in the repo (dist/ is gitignored).
on:
  push:
    branches: [main]

# Rolling release: runs must not overlap, queue them instead.
concurrency:
  group: continuous-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sep: ":"
            server: true
          - os: windows-latest
            sep: ";"
            server: false
          - os: macos-latest
            sep: ":"
            server: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install build deps
        shell: bash
        run: |
          python -m pip install --upgrade pip pyinstaller flask
          python -m pip install pywebview || true
      - name: stamp build version
        # Baked into the binaries (see /api/version) for the in-app
        # update check: build number + commit SHA + UTC date.
        shell: bash
        run: |
          cat > app/build_info.py <<EOF
          BUILD_NUMBER = ${{ github.run_number }}
          BUILD_SHA = "${{ github.sha }}"
          BUILD_DATE = "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          EOF
      - name: linux window backend deps
        # The window needs PyGObject + Gtk/WebKit GIR data at BUILD time
        # so PyInstaller can bundle them (setup-python can't see apt's
        # dist-packages otherwise); the frozen app then runs its window
        # on any desktop Linux without extra installs.
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q python3-gi gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 libgtk-3-0 libwebkit2gtk-4.1-0
          echo "PYTHONPATH=/usr/lib/python3/dist-packages" >> "$GITHUB_ENV"
      - name: build desktop binary (distributed)
        # Everything (excludes, hooks, per-OS icon) lives in the spec —
        # see build/wow-chat-desktop.spec for why.
        shell: bash
        run: python -m PyInstaller --noconfirm build/wow-chat-desktop.spec
      - name: build server binary (linux only, headless use)
        if: matrix.server
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --onefile \
            --name wow-chat \
            --add-data "web:web" run.py
      - name: stage artifacts
        shell: bash
        run: |
          mkdir -p release
          os="${{ matrix.os }}"
          if [ "$os" = "windows-latest" ]; then
            cp dist/wow-chat-desktop.exe release/wow-chat-desktop-windows.exe
          elif [ "$os" = "macos-latest" ]; then
            cp dist/wow-chat-desktop release/wow-chat-desktop-macos
          else
            cp dist/wow-chat-desktop release/wow-chat-desktop-linux
            cp dist/wow-chat release/wow-chat-server-linux
          fi
          ls -la release/
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: release/
          if-no-files-found: error

  appimage:
    name: appimage (linux)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binaries-ubuntu-latest
          path: dl
      - name: assemble AppImage
        shell: bash
        run: |
          mkdir -p dist
          cp dl/wow-chat-desktop-linux dist/wow-chat-desktop
          chmod +x dist/wow-chat-desktop
          bash build/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-appimage
          path: WoW-Chat-Client-linux-x86_64.AppImage
          if-no-files-found: error

  build-apk:
    name: apk (android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: install Android SDK
        # (android-actions/setup-android calls `sdkmanager tools`, a
        # package Google removed long ago — install manually instead.)
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q wget unzip
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd "$HOME/android-sdk"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip -d cmdline-tools/tmp
          mv cmdline-tools/tmp/cmdline-tools cmdline-tools/latest
          rm -rf cmdline-tools/tmp cmdtools.zip
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"
          yes | cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: refresh bundled python copy
        shell: bash
        run: bash build/sync-android.sh
      - name: stamp android build version
        # Same baked-in identity as the desktop build (see /api/version):
        # without this the APK reports sha "dev" and the in-app update
        # check stays silent.
        shell: bash
        run: |
          cat > android/app/src/main/python/app/build_info.py <<EOF
          BUILD_NUMBER = ${{ github.run_number }}
          BUILD_SHA = "${{ github.sha }}"
          BUILD_DATE = "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          EOF
      - name: build debug APK
        shell: bash
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: stage APK
        shell: bash
        run: |
          mkdir -p apk-out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            apk-out/wow-chat-android.apk
          ls -la apk-out/
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-apk
          path: apk-out/
          if-no-files-found: error

  release:
    name: publish continuous release
    needs: [build, appimage, build-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=continuous
          SHA=$(git rev-parse --short HEAD)
          FULL_SHA=$(git rev-parse HEAD)
          DATE=$(date -u +%Y-%m-%d)
          TITLE="Continuous build #$RUN_NUMBER ($DATE, $SHA)"
          # The bare Linux desktop onefile is a build intermediate only —
          # end users get the AppImage instead.
          rm -f release/wow-chat-desktop-linux
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            NOTES="$(git log --format='- %h %s (%an)' "$TAG"..HEAD)"
            [ -z "$NOTES" ] && NOTES="- (no new commits)"
          else
            NOTES="$(git log --format='- %h %s (%an)' -20)"
          fi
          read -r -d '' BODY <<EOF || true
          Automated build of \`main\` @ \`$FULL_SHA\` ($DATE).
          Binaries are rebuilt on every push; \`dist/\` is never stored in the repo.
          The app checks this release on startup (build #$RUN_NUMBER baked in).

          **Desktop (distributed)** — double-click and chat, no browser needed:
          - \`WoW-Chat-Client-linux-x86_64.AppImage\` (Linux)
          - \`wow-chat-desktop-windows.exe\`
          - \`wow-chat-desktop-macos\` (Apple Silicon runner; Intel Macs need Rosetta)
          - \`wow-chat-android.apk\` (Android: allow unknown sources to install)

          **Server (headless)** — serves the browser UI on port 5950:
          - \`wow-chat-server-linux\`

          Linux desktop needs system WebKit2GTK to open its own window;
          without it the binary falls back to the system browser.

          ## Commits since last build
          $NOTES
          EOF
          git tag -f "$TAG" HEAD
          git push -f origin "$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Flush every old asset (renames would otherwise linger next
            # to the new uploads), then publish the fresh set.
            for a in $(gh release view "$TAG" --json assets \
                         -q '.assets[].name'); do
              gh release delete-asset "$TAG" "$a" -y
            done
            gh release upload "$TAG" release/*
            gh release edit "$TAG" --title "$TITLE" --notes "$BODY"
          else
            gh release create "$TAG" release/* --title "$TITLE" \
              --notes "$BODY" --prerelease
          fi
          ls -la release/
