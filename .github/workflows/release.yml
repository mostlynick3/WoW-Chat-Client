name: build-and-release

# Every push to main: build the server + desktop binaries on all OSes
# and (re)publish them on the rolling "continuous" release.
# Nothing binary is ever stored in the repo (dist/ is gitignored).
on:
  push:
    branches: [main]

# Rolling release: runs must not overlap, queue them instead.
concurrency:
  group: continuous-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sep: ":"
            server: true
          - os: windows-latest
            sep: ";"
            server: false
          - os: macos-latest
            sep: ":"
            server: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install build deps
        shell: bash
        run: |
          python -m pip install --upgrade pip pyinstaller flask
          python -m pip install pywebview || true
      - name: stamp build version
        # Baked into the binaries (see /api/version) for the in-app
        # update check: build number + commit SHA + UTC date.
        shell: bash
        run: |
          cat > app/build_info.py <<EOF
          BUILD_NUMBER = ${{ github.run_number }}
          BUILD_SHA = "${{ github.sha }}"
          BUILD_DATE = "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          EOF
      - name: build desktop binary (distributed)
        shell: bash
        # Same trims as build/build-all.sh: exclude unused toolkits/data
        # libs (else ~500MB), custom gi.repository.Gtk hook override
        # (else ~1GB of cursor/icon themes), W icon per OS.
        run: |
          case "${{ matrix.os }}" in
            windows-latest) ICON_ARG="--icon build/icon.ico" ;;
            macos-latest) ICON_ARG="--icon build/icon.icns" ;;
            *) ICON_ARG="" ;;
          esac
          # shellcheck disable=SC2086
          python -m PyInstaller --noconfirm --onefile \
            --name wow-chat-desktop \
            --exclude-module PyQt5 --exclude-module PyQt6 \
            --exclude-module PySide2 --exclude-module PySide6 \
            --exclude-module wx \
            --exclude-module numpy --exclude-module pandas \
            --exclude-module scipy --exclude-module matplotlib \
            --exclude-module pygame --exclude-module PIL \
            --exclude-module tkinter \
            --exclude-module jnius --exclude-module cryptography \
            $ICON_ARG \
            --additional-hooks-dir build/pyinstaller-hooks \
            --add-data "web${{ matrix.sep }}web" desktop.py
      - name: build server binary (linux only, headless use)
        if: matrix.server
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --onefile \
            --name wow-chat \
            --add-data "web:web" run.py
      - name: stage artifacts
        shell: bash
        run: |
          mkdir -p release
          os="${{ matrix.os }}"
          if [ "$os" = "windows-latest" ]; then
            cp dist/wow-chat-desktop.exe release/wow-chat-desktop-windows.exe
          elif [ "$os" = "macos-latest" ]; then
            cp dist/wow-chat-desktop release/wow-chat-desktop-macos
          else
            cp dist/wow-chat-desktop release/wow-chat-desktop-linux
            cp dist/wow-chat release/wow-chat-server-linux
          fi
          ls -la release/
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: release/
          if-no-files-found: error

  appimage:
    name: appimage (linux)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binaries-ubuntu-latest
          path: dl
      - name: assemble AppImage
        shell: bash
        run: |
          mkdir -p dist
          cp dl/wow-chat-desktop-linux dist/wow-chat-desktop
          chmod +x dist/wow-chat-desktop
          bash build/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-appimage
          path: WoW-Chat-Client-linux-x86_64.AppImage
          if-no-files-found: error

  release:
    name: publish continuous release
    needs: [build, appimage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=continuous
          SHA=$(git rev-parse --short HEAD)
          FULL_SHA=$(git rev-parse HEAD)
          DATE=$(date -u +%Y-%m-%d)
          TITLE="Continuous build #$RUN_NUMBER ($DATE, $SHA)"
          # The bare Linux desktop onefile is a build intermediate only —
          # end users get the AppImage instead.
          rm -f release/wow-chat-desktop-linux
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            NOTES="$(git log --format='- %h %s (%an)' "$TAG"..HEAD)"
            [ -z "$NOTES" ] && NOTES="- (no new commits)"
          else
            NOTES="$(git log --format='- %h %s (%an)' -20)"
          fi
          read -r -d '' BODY <<EOF || true
          Automated build of \`main\` @ \`$FULL_SHA\` ($DATE).
          Binaries are rebuilt on every push; \`dist/\` is never stored in the repo.
          The app checks this release on startup (build #$RUN_NUMBER baked in).

          **Desktop (distributed)** — double-click and chat, no browser needed:
          - \`WoW-Chat-Client-linux-x86_64.AppImage\` (Linux)
          - \`wow-chat-desktop-windows.exe\`
          - \`wow-chat-desktop-macos\` (Apple Silicon runner; Intel Macs need Rosetta)

          **Server (headless)** — serves the browser UI on port 5950:
          - \`wow-chat-server-linux\`

          Linux desktop needs system WebKit2GTK to open its own window;
          without it the binary falls back to the system browser.

          ## Commits since last build
          $NOTES
          EOF
          git tag -f "$TAG" HEAD
          git push -f origin "$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$BODY"
          else
            gh release create "$TAG" release/* --title "$TITLE" \
              --notes "$BODY" --prerelease
          fi
          ls -la release/
