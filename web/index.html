<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yggdrasil - WoW Chat</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <!-- ============ LOGIN WIZARD (in-game style) ============ -->
  <section id="loginView" class="wizard wowscreen">
    <div id="pane1" class="pane wowlogin">
      <div class="gametitle">WoW Chat Client</div>
      <div class="wowfield">
        <label class="wowlabel" for="serverPick">Server</label>
        <select id="serverPick" class="wowinput">
          <option value="yggdrasil" selected>Yggdrasil</option>
          <option value="truewow">TrueWoW</option>
          <option value="chromiecraft">ChromieCraft</option>
          <option value="risinggods">Rising Gods</option>
          <option value="manual">Manual entry…</option>
        </select>
      </div>
      <div id="manualBox" class="hidden">
        <div class="wowfield"><label class="wowlabel" for="authHost">Auth address</label>
          <input id="authHost" class="wowinput" placeholder="logon.example.com" autocomplete="off"></div>
        <div class="wowfield"><label class="wowlabel" for="authPort">Auth port</label>
          <input id="authPort" class="wowinput" value="3724" inputmode="numeric"></div>
      </div>
      <div class="wowfield">
        <label class="wowlabel" for="username">Account Name</label>
        <input id="username" class="wowinput" autocomplete="username">
      </div>
      <div class="wowfield">
        <label class="wowlabel" for="password">Password</label>
        <input id="password" class="wowinput" type="password" autocomplete="current-password">
      </div>
      <div id="tokenBox" class="wowfield hidden">
        <label class="wowlabel" for="token">Authenticator code</label>
        <input id="token" class="wowinput" inputmode="numeric" autocomplete="one-time-code"
          placeholder="6-digit code" maxlength="8">
      </div>
      <div class="wowfield"><button id="btnAuth" class="wowbtn-red">Login</button><span id="authMsg" class="msg"></span></div>
      <label class="wowcheck"><input type="checkbox" id="remember" checked> Remember Account Name</label>
    </div>

    <div id="pane2" class="pane hidden wowrealm">
      <div class="wowframe-title">Realm Selection</div>
      <div class="realmhead"><span>Realm Name</span><span>Type</span><span>Characters</span><span>Population</span></div>
      <div id="realmList" class="realmlist"></div>
      <div class="row"><button id="btnBack1" class="wowbtn">Back</button><button id="btnChars" class="wowbtn-red">Okay</button><span id="realmMsg" class="msg"></span></div>
    </div>

    <div id="pane3" class="pane hidden wowchars">
      <div id="charRealm" class="wowchars-realm">–</div>
      <div><button id="btnBack2" class="wowbtn-red small">Change Realm</button></div>
      <div id="charList" class="charlist"></div>
      <div class="row"><button id="btnEnter" class="wowbtn-red">Enter World</button><span id="charMsg" class="msg"></span></div>
    </div>
  </section>

  <!-- ============ CHAT (in-game style: frame left, menu right) ============ -->
  <section id="chatView" class="hidden chatlayout">
    <section class="chatframe">
      <div class="tabbar"><div id="tabs" class="tabs"></div><button id="btnAddTab" class="tabadd" title="New tab">+</button></div>
      <div class="feedwrap">
        <div id="feed"></div>
        <div class="feednav">
          <button id="btnUp" title="Scroll up">▲</button>
          <button id="btnDown" title="Scroll down">▼</button>
        </div>
      </div>
      <div class="composer">
        <select id="kind" title="Chat type">
          <option value="say">Say</option>
          <option value="yell">Yell</option>
          <option value="emote">Emote</option>
          <option value="party">Party</option>
          <option value="guild">Guild</option>
          <option value="officer">Officer</option>
          <option value="raid">Raid</option>
          <option value="raid_warning">RaidWarn</option>
          <option value="battleground">BG</option>
          <option value="whisper">Whisper</option>
          <option value="channel" selected>Channel</option>
        </select>
        <input id="target" value="" title="Whisper target" placeholder="Player name">
        <select id="targetSel" title="Joined channels"></select>
        <input id="text" placeholder="Message…  (Enter sends, /join Name joins)" autocomplete="off">
        <button id="btnSend" class="primary">Send</button>
      </div>
    </section>
    <aside class="gamemenu">
      <div class="menutitle">Menu</div>
      <div class="menuid">
        <div class="charname" id="whoChar">–</div>
        <div class="muted" id="whoRealm">–</div>
      </div>
      <button id="btnChanOpen" class="wowbtn-red">Channel</button>
      <button id="btnLangOpen" class="wowbtn-red">Language: Auto</button>
      <button id="btnWhoOpen" class="wowbtn-red">Who List</button>
      <button id="btnLogout" class="wowbtn-red">Logout</button>
      <button id="btnUpdate" class="wowbtn-red">Check Updates</button>
      <div id="updateMsg" class="msg updatemsg"></div>
    </aside>
  </section>

  <div id="whoModal" class="hidden">
    <div class="whobox">
      <div class="wowframe-title">Who List</div>
      <label>Name filter<input id="whoName" placeholder="part of a name"></label>
      <div class="row"><button id="btnWho" class="wowbtn-red">Search</button><button id="btnWhoClose" class="wowbtn">Close</button><span id="whoMsg" class="msg"></span></div>
      <div id="whoResults" class="whoresults hidden"></div>
    </div>
  </div>

  <div id="chanModal" class="hidden">
    <div class="whobox">
      <div class="wowframe-title">Channel</div>
      <label>Join<input id="chanName" placeholder="Channel name"></label>
      <label>Password<input id="chanPass" placeholder="optional"></label>
      <div class="row"><button id="btnJoin" class="wowbtn-red">Join</button></div>
      <label>Joined<select id="chanJoined"></select></label>
      <div class="row"><button id="btnLeave" class="wowbtn">Leave</button><button id="btnChanList" class="wowbtn">Members</button><span id="chanMsg" class="msg"></span></div>
      <div id="chanMembers" class="whoresults hidden"></div>
      <div class="row"><button id="btnChanClose" class="wowbtn">Close</button></div>
    </div>
  </div>

  <div id="langModal" class="hidden">
    <div class="whobox">
      <div class="wowframe-title">Language</div>
      <div id="langList" class="langlist"></div>
      <div class="row"><button id="btnLangClose" class="wowbtn">Close</button></div>
    </div>
  </div>
</main>

<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
